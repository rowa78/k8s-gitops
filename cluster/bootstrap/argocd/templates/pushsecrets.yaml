# Migration SealedSecret -> ExternalSecret (Schritt 1): schreibt die Secrets dieses Verzeichnisses je in den
# 1Password-Eintrag `<namespace>#<secret-name>` (Tresor k8s). Wird mit der Umstellung entfernt.
{{- if .Values.sealedsecret }}
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword-push
  selector:
    secret:
      name: argocd-notifications-secret
  data:
    - match:
        secretKey: email-host
        remoteRef:
          remoteKey: argocd#argocd-notifications-secret
          property: email-host
    - match:
        secretKey: email-password
        remoteRef:
          remoteKey: argocd#argocd-notifications-secret
          property: email-password
    - match:
        secretKey: email-port
        remoteRef:
          remoteKey: argocd#argocd-notifications-secret
          property: email-port
    - match:
        secretKey: email-username
        remoteRef:
          remoteKey: argocd#argocd-notifications-secret
          property: email-username
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: argocd-auth
  namespace: argocd
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword-push
  selector:
    secret:
      name: argocd-auth
  data:
    - match:
        secretKey: client-id
        remoteRef:
          remoteKey: argocd#argocd-auth
          property: client-id
    - match:
        secretKey: client-secret
        remoteRef:
          remoteKey: argocd#argocd-auth
          property: client-secret
{{- end }}
