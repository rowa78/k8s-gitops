# Secrets aus dem 1Password-Tresor k8s (Eintrag <namespace>#<secret-name>), migriert von SealedSecrets.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-auth
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: argocd-auth
    template:
      metadata:
        labels:
          # Argo CD löst $argocd-auth:<key> in der Dex-Konfiguration nur bei diesem Label auf
          app.kubernetes.io/part-of: argocd
  dataFrom:
    - extract:
        key: argocd#argocd-auth
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: argocd-notifications-secret
  dataFrom:
    - extract:
        key: argocd#argocd-notifications-secret
