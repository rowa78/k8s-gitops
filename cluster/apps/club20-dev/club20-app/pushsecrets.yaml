# Migration SealedSecret -> ExternalSecret (Schritt 1): schreibt die Secrets dieses Verzeichnisses je in den
# 1Password-Eintrag `<namespace>#<secret-name>` (Tresor k8s). Wird mit der Umstellung entfernt.
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: club20-secrets
  namespace: club20-dev
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword-push
  selector:
    secret:
      name: club20-secrets
  data:
    - match:
        secretKey: admin-initial-password
        remoteRef:
          remoteKey: club20-dev#club20-secrets
          property: admin-initial-password
    - match:
        secretKey: jwt-secret
        remoteRef:
          remoteKey: club20-dev#club20-secrets
          property: jwt-secret
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: externalregistry
  namespace: club20-dev
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword-push
  selector:
    secret:
      name: externalregistry
  data:
    - match:
        secretKey: .dockerconfigjson
        remoteRef:
          remoteKey: club20-dev#externalregistry
          property: .dockerconfigjson
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: source-db-secret
  namespace: club20-dev
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword-push
  selector:
    secret:
      name: source-db-secret
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: club20-dev#source-db-secret
          property: password
