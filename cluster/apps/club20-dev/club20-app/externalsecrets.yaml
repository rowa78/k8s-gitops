# Secrets aus dem 1Password-Tresor k8s (Eintrag <namespace>#<secret-name>), migriert von SealedSecrets.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: club20-secrets
  namespace: club20-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: club20-secrets
  dataFrom:
    - extract:
        key: club20-dev#club20-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: externalregistry
  namespace: club20-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: externalregistry
    template:
      type: kubernetes.io/dockerconfigjson
  dataFrom:
    - extract:
        key: club20-dev#externalregistry
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: source-db-secret
  namespace: club20-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: source-db-secret
  dataFrom:
    - extract:
        key: club20-dev#source-db-secret
