# Secrets aus dem 1Password-Tresor k8s (Eintrag <namespace>#<secret-name>), migriert von SealedSecrets.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: externalregistry
  namespace: finance-tracker
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: externalregistry
    template:
      type: kubernetes.io/dockerconfigjson
  dataFrom:
    - extract:
        key: finance-tracker#externalregistry
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jwt-secret
  namespace: finance-tracker
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: jwt-secret
  dataFrom:
    - extract:
        key: finance-tracker#jwt-secret
