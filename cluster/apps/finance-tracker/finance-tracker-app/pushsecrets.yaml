# Migration SealedSecret -> ExternalSecret (Schritt 1): schreibt die Secrets dieses Verzeichnisses je in den
# 1Password-Eintrag `<namespace>#<secret-name>` (Tresor k8s). Wird mit der Umstellung entfernt.
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: externalregistry
  namespace: finance-tracker
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword-push
  selector:
    secret:
      name: externalregistry
  data:
    - match:
        secretKey: .dockerconfigjson
        remoteRef:
          remoteKey: finance-tracker#externalregistry
          property: .dockerconfigjson
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: jwt-secret
  namespace: finance-tracker
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword-push
  selector:
    secret:
      name: jwt-secret
  data:
    - match:
        secretKey: jwt-secret-key
        remoteRef:
          remoteKey: finance-tracker#jwt-secret
          property: jwt-secret-key
