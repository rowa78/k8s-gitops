# Secrets aus dem 1Password-Tresor k8s (Eintrag <namespace>#<secret-name>), migriert von SealedSecrets.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-secret
  namespace: paperless
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: db-secret
  dataFrom:
    - extract:
        key: paperless#db-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless
  namespace: paperless
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: paperless
  dataFrom:
    - extract:
        key: paperless#paperless
