# Migration SealedSecret -> ExternalSecret (Schritt 1): schreibt die Secrets dieses Verzeichnisses je in den
# 1Password-Eintrag `<namespace>#<secret-name>` (Tresor k8s). Wird mit der Umstellung entfernt.
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: db-secret
  namespace: paperless
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword-push
  selector:
    secret:
      name: db-secret
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: paperless#db-secret
          property: password
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: paperless
  namespace: paperless
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword-push
  selector:
    secret:
      name: paperless
  data:
    - match:
        secretKey: admin-mail
        remoteRef:
          remoteKey: paperless#paperless
          property: admin-mail
    - match:
        secretKey: admin-password
        remoteRef:
          remoteKey: paperless#paperless
          property: admin-password
    - match:
        secretKey: admin-user
        remoteRef:
          remoteKey: paperless#paperless
          property: admin-user
    - match:
        secretKey: mail-from
        remoteRef:
          remoteKey: paperless#paperless
          property: mail-from
    - match:
        secretKey: mail-host
        remoteRef:
          remoteKey: paperless#paperless
          property: mail-host
    - match:
        secretKey: mail-password
        remoteRef:
          remoteKey: paperless#paperless
          property: mail-password
    - match:
        secretKey: mail-port
        remoteRef:
          remoteKey: paperless#paperless
          property: mail-port
    - match:
        secretKey: mail-user
        remoteRef:
          remoteKey: paperless#paperless
          property: mail-user
    - match:
        secretKey: secret-key
        remoteRef:
          remoteKey: paperless#paperless
          property: secret-key
