# Migration SealedSecret -> ExternalSecret (Schritt 1): schreibt die Secrets dieses Verzeichnisses je in den
# 1Password-Eintrag `<namespace>#<secret-name>` (Tresor k8s). Wird mit der Umstellung entfernt.
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: db-secret
  namespace: guacamole
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword-push
  selector:
    secret:
      name: db-secret
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: guacamole#db-secret
          property: password
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: oidc
  namespace: guacamole
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword-push
  selector:
    secret:
      name: oidc
  data:
    - match:
        secretKey: OPENID_ALLOWED_CLOCK_SKEW
        remoteRef:
          remoteKey: guacamole#oidc
          property: OPENID_ALLOWED_CLOCK_SKEW
    - match:
        secretKey: OPENID_AUTHORIZATION_ENDPOINT
        remoteRef:
          remoteKey: guacamole#oidc
          property: OPENID_AUTHORIZATION_ENDPOINT
    - match:
        secretKey: OPENID_CLIENT_ID
        remoteRef:
          remoteKey: guacamole#oidc
          property: OPENID_CLIENT_ID
    - match:
        secretKey: OPENID_CLIENT_SECRET
        remoteRef:
          remoteKey: guacamole#oidc
          property: OPENID_CLIENT_SECRET
    - match:
        secretKey: OPENID_GROUPS_CLAIM_TYPE
        remoteRef:
          remoteKey: guacamole#oidc
          property: OPENID_GROUPS_CLAIM_TYPE
    - match:
        secretKey: OPENID_ISSUER
        remoteRef:
          remoteKey: guacamole#oidc
          property: OPENID_ISSUER
    - match:
        secretKey: OPENID_JWKS_ENDPOINT
        remoteRef:
          remoteKey: guacamole#oidc
          property: OPENID_JWKS_ENDPOINT
    - match:
        secretKey: OPENID_MAX_TOKEN_VALIDITY
        remoteRef:
          remoteKey: guacamole#oidc
          property: OPENID_MAX_TOKEN_VALIDITY
    - match:
        secretKey: OPENID_REDIRECT_URI
        remoteRef:
          remoteKey: guacamole#oidc
          property: OPENID_REDIRECT_URI
    - match:
        secretKey: OPENID_SCOPE
        remoteRef:
          remoteKey: guacamole#oidc
          property: OPENID_SCOPE
    - match:
        secretKey: OPENID_USERNAME_CLAIM_TYPE
        remoteRef:
          remoteKey: guacamole#oidc
          property: OPENID_USERNAME_CLAIM_TYPE
