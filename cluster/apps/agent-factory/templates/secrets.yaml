# Secrets der Agent Factory aus dem 1Password-Tresor k8s (Eintrag agent-factory#<secret-name>)
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-factory-ui
  namespace: agent-factory
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: onepassword }
  target: { name: agent-factory-ui }
  dataFrom:
    - extract: { key: agent-factory#agent-factory-ui }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-factory-bot
  namespace: agent-factory
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: onepassword }
  target: { name: agent-factory-bot }
  dataFrom:
    - extract: { key: agent-factory#agent-factory-bot }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-factory-dispatcher
  namespace: agent-factory
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: onepassword }
  target: { name: agent-factory-dispatcher }
  dataFrom:
    - extract: { key: agent-factory#agent-factory-dispatcher }
---
# PEM base64-kodiert in 1Password (Zeilenumbrüche in Feldern sind unzuverlässig), hier zurückgewandelt
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-factory-github-app
  namespace: agent-factory
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: onepassword }
  target:
    name: agent-factory-github-app
    template:
      data:
        github-app.pem: '{{ .pem_b64 | b64dec }}'
  data:
    - secretKey: pem_b64
      remoteRef: { key: agent-factory#agent-factory-github-app, property: pem_b64 }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-factory-worker-k8s-1
  namespace: agent-factory
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: onepassword }
  target: { name: agent-factory-worker-k8s-1 }
  dataFrom:
    - extract: { key: agent-factory#agent-factory-worker-k8s-1 }
---
# Pull-Secret für die privaten GHCR-Images (values-homelab.yaml: image.pullSecrets ghcr)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr
  namespace: agent-factory
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: onepassword }
  target:
    name: ghcr
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}'
  dataFrom:
    - extract: { key: agent-factory#ghcr }