# Migration SealedSecret -> ExternalSecret (Schritt 1): schreibt die Secrets dieses Verzeichnisses je in den
# 1Password-Eintrag `<namespace>#<secret-name>` (Tresor k8s). Wird mit der Umstellung entfernt.
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: elevenlabs-secret
  namespace: vocabolario-dev
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword-push
  selector:
    secret:
      name: elevenlabs-secret
  data:
    - match:
        secretKey: api-key
        remoteRef:
          remoteKey: vocabolario-dev#elevenlabs-secret
          property: api-key
    - match:
        secretKey: speaker-a-voice-id
        remoteRef:
          remoteKey: vocabolario-dev#elevenlabs-secret
          property: speaker-a-voice-id
    - match:
        secretKey: speaker-b-voice-id
        remoteRef:
          remoteKey: vocabolario-dev#elevenlabs-secret
          property: speaker-b-voice-id
---
