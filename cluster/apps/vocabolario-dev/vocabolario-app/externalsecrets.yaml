# Secrets aus dem 1Password-Tresor k8s (Eintrag <namespace>#<secret-name>), migriert von SealedSecrets.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: elevenlabs-secret
  namespace: vocabolario-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: elevenlabs-secret
  dataFrom:
    - extract:
        key: vocabolario-dev#elevenlabs-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: externalregistry
  namespace: vocabolario-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: externalregistry
    template:
      type: kubernetes.io/dockerconfigjson
  dataFrom:
    - extract:
        key: vocabolario-dev#externalregistry
