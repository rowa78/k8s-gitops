---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "wildcard-cert"
spec:
  secretName: "wildcard-tls"
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "vocabolario.rwcloud.org"
  dnsNames:
  - "vocabolario.rwcloud.org"
  - "*.vocabolario.rwcloud.org"