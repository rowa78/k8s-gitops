# Migration SealedSecret -> ExternalSecret (Schritt 1): schreibt die Secrets dieses Verzeichnisses je in den
# 1Password-Eintrag `<namespace>#<secret-name>` (Tresor k8s). Wird mit der Umstellung entfernt.
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: rclone-config
  namespace: backrest
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword-push
  selector:
    secret:
      name: rclone-config
  data:
    - match:
        secretKey: rclone.conf
        remoteRef:
          remoteKey: backrest#rclone-config
          property: rclone.conf
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: ssh-config
  namespace: backrest
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword-push
  selector:
    secret:
      name: ssh-config
  data:
    - match:
        secretKey: config
        remoteRef:
          remoteKey: backrest#ssh-config
          property: config
    - match:
        secretKey: id_ed25519
        remoteRef:
          remoteKey: backrest#ssh-config
          property: id_ed25519
    - match:
        secretKey: id_ed25519.pub  # gitleaks:allow (Feldname, kein Secret)
        remoteRef:
          remoteKey: backrest#ssh-config
          property: id_ed25519.pub
    - match:
        secretKey: known_hosts
        remoteRef:
          remoteKey: backrest#ssh-config
          property: known_hosts
