# Secrets aus dem 1Password-Tresor k8s (Eintrag <namespace>#<secret-name>), migriert von SealedSecrets.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rclone-config
  namespace: backrest
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: rclone-config
  dataFrom:
    - extract:
        key: backrest#rclone-config
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ssh-config
  namespace: backrest
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ssh-config
  dataFrom:
    - extract:
        key: backrest#ssh-config
