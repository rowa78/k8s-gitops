# Secrets aus dem 1Password-Tresor k8s (Eintrag <namespace>#<secret-name>), migriert von SealedSecrets.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bmw
  namespace: bmw
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: bmw
  dataFrom:
    - extract:
        key: bmw#bmw
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: externalregistry
  namespace: bmw
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: externalregistry
    template:
      type: kubernetes.io/dockerconfigjson
  dataFrom:
    - extract:
        key: bmw#externalregistry
