# Migration SealedSecret -> ExternalSecret (Schritt 1): schreibt die Secrets dieses Verzeichnisses je in den
# 1Password-Eintrag `<namespace>#<secret-name>` (Tresor k8s). Wird mit der Umstellung entfernt.
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: bmw
  namespace: bmw
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword-push
  selector:
    secret:
      name: bmw
  data:
    - match:
        secretKey: clientid
        remoteRef:
          remoteKey: bmw#bmw
          property: clientid
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: externalregistry
  namespace: bmw
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword-push
  selector:
    secret:
      name: externalregistry
  data:
    - match:
        secretKey: .dockerconfigjson
        remoteRef:
          remoteKey: bmw#externalregistry
          property: .dockerconfigjson
