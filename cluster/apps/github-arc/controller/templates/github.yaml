# Secret aus dem 1Password-Tresor k8s (Eintrag <namespace>#<secret-name>), migriert von SealedSecret.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github
  namespace: github-arc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: github
  dataFrom:
    - extract:
        key: github-arc#github
