# Secret aus dem 1Password-Tresor k8s (Eintrag <namespace>#<secret-name>), migriert vom SealedSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-secret
  namespace: clash
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: db-secret
  dataFrom:
    - extract:
        key: clash#db-secret
