# Secrets aus dem 1Password-Tresor k8s (Eintrag <namespace>#<secret-name>), migriert von SealedSecrets.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: externalregistry
  namespace: jenkins
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: externalregistry
    template:
      type: kubernetes.io/dockerconfigjson
  dataFrom:
    - extract:
        key: jenkins#externalregistry
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: secret-credentials
  namespace: jenkins
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: secret-credentials
  dataFrom:
    - extract:
        key: jenkins#secret-credentials
