# Migration SealedSecret -> ExternalSecret (Schritt 1): schreibt die Secrets dieses Verzeichnisses je in den
# 1Password-Eintrag `<namespace>#<secret-name>` (Tresor k8s). Wird mit der Umstellung entfernt.
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: externalregistry
  namespace: jenkins
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword-push
  selector:
    secret:
      name: externalregistry
  data:
    - match:
        secretKey: .dockerconfigjson
        remoteRef:
          remoteKey: jenkins#externalregistry
          property: .dockerconfigjson
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: secret-credentials
  namespace: jenkins
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword-push
  selector:
    secret:
      name: secret-credentials
  data:
    - match:
        secretKey: openid-client-secret
        remoteRef:
          remoteKey: jenkins#secret-credentials
          property: openid-client-secret
