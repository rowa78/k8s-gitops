# Migration SealedSecret -> ExternalSecret (Schritt 1): schreibt die Secrets dieses Verzeichnisses je in den
# 1Password-Eintrag `<namespace>#<secret-name>` (Tresor k8s). Wird mit der Umstellung entfernt.
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: db-secret
  namespace: forgejo
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword-push
  selector:
    secret:
      name: db-secret
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: forgejo#db-secret
          property: password
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: forgejo-admin-secret
  namespace: forgejo
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword-push
  selector:
    secret:
      name: forgejo-admin-secret
  data:
    - match:
        secretKey: email
        remoteRef:
          remoteKey: forgejo#forgejo-admin-secret
          property: email
    - match:
        secretKey: password
        remoteRef:
          remoteKey: forgejo#forgejo-admin-secret
          property: password
    - match:
        secretKey: username
        remoteRef:
          remoteKey: forgejo#forgejo-admin-secret
          property: username
---
