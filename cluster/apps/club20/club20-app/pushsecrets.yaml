# Migration SealedSecret -> ExternalSecret (Schritt 1): schreibt die Secrets dieses Verzeichnisses je in den
# 1Password-Eintrag `<namespace>#<secret-name>` (Tresor k8s). Wird mit der Umstellung entfernt.
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: club20-secrets
  namespace: club20
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword-push
  selector:
    secret:
      name: club20-secrets
  data:
    - match:
        secretKey: admin-initial-password
        remoteRef:
          remoteKey: club20#club20-secrets
          property: admin-initial-password
    - match:
        secretKey: jwt-secret
        remoteRef:
          remoteKey: club20#club20-secrets
          property: jwt-secret
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: db
  namespace: club20
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword-push
  selector:
    secret:
      name: db
  data:
    - match:
        secretKey: database
        remoteRef:
          remoteKey: club20#db
          property: database
    - match:
        secretKey: host
        remoteRef:
          remoteKey: club20#db
          property: host
    - match:
        secretKey: jdbc-uri
        remoteRef:
          remoteKey: club20#db
          property: jdbc-uri
    - match:
        secretKey: password
        remoteRef:
          remoteKey: club20#db
          property: password
    - match:
        secretKey: port
        remoteRef:
          remoteKey: club20#db
          property: port
    - match:
        secretKey: username
        remoteRef:
          remoteKey: club20#db
          property: username
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: externalregistry
  namespace: club20
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword-push
  selector:
    secret:
      name: externalregistry
  data:
    - match:
        secretKey: .dockerconfigjson
        remoteRef:
          remoteKey: club20#externalregistry
          property: .dockerconfigjson
