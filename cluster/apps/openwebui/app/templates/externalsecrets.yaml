# Secrets aus dem 1Password-Tresor k8s (Eintrag <namespace>#<secret-name>), migriert von SealedSecrets.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db
  namespace: openwebui
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: db
  dataFrom:
    - extract:
        key: openwebui#db
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openai-api-keys
  namespace: openwebui
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: openai-api-keys
  dataFrom:
    - extract:
        key: openwebui#openai-api-keys
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openid-config
  namespace: openwebui
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: openid-config
  dataFrom:
    - extract:
        key: openwebui#openid-config
