# Migration SealedSecret -> ExternalSecret (Schritt 1): schreibt die Secrets dieses Verzeichnisses je in den
# 1Password-Eintrag `<namespace>#<secret-name>` (Tresor k8s). Wird mit der Umstellung entfernt.
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: db
  namespace: openwebui
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword-push
  selector:
    secret:
      name: db
  data:
    - match:
        secretKey: url
        remoteRef:
          remoteKey: openwebui#db
          property: url
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: openai-api-keys
  namespace: openwebui
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword-push
  selector:
    secret:
      name: openai-api-keys
  data:
    - match:
        secretKey: api-keys
        remoteRef:
          remoteKey: openwebui#openai-api-keys
          property: api-keys
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: openid-config
  namespace: openwebui
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword-push
  selector:
    secret:
      name: openid-config
  data:
    - match:
        secretKey: ENABLE_OAUTH_SIGNUP
        remoteRef:
          remoteKey: openwebui#openid-config
          property: ENABLE_OAUTH_SIGNUP
    - match:
        secretKey: OAUTH_CLIENT_ID
        remoteRef:
          remoteKey: openwebui#openid-config
          property: OAUTH_CLIENT_ID
    - match:
        secretKey: OAUTH_CLIENT_SECRET
        remoteRef:
          remoteKey: openwebui#openid-config
          property: OAUTH_CLIENT_SECRET
    - match:
        secretKey: OAUTH_PROVIDER_NAME
        remoteRef:
          remoteKey: openwebui#openid-config
          property: OAUTH_PROVIDER_NAME
    - match:
        secretKey: OPENID_PROVIDER_URL
        remoteRef:
          remoteKey: openwebui#openid-config
          property: OPENID_PROVIDER_URL
