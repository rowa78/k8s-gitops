# Schreibender Store fuer die SealedSecret-Migration (PushSecret). Das Secret
# `onepassword-push-service-account` (Schluessel `token`) im Namespace `external-secrets`
# wird von Hand als SealedSecret angelegt (templates/onepassword-push-service-account.yaml).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword-push
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    onepasswordSDK:
      vault: k8s
      auth:
        serviceAccountSecretRef:
          name: onepassword-push-service-account
          namespace: external-secrets
          key: token
