# Das Secret `onepassword-service-account` (Schluessel `token`) im Namespace
# `external-secrets` wird von Hand als SealedSecret angelegt (templates/onepassword-service-account.yaml).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  provider:
    onepasswordSDK:
      vault: k8s
      auth:
        serviceAccountSecretRef:
          name: onepassword-service-account
          namespace: external-secrets
          key: token
