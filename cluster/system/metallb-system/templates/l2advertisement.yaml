apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: lan
  namespace: metallb-system
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  ipAddressPools:
    - lan
  # Interface des Nodes k3s-luna (br0 gibt es dort nicht – dann kündigt MetalLB nichts an)
  interfaces:
    - eth0
