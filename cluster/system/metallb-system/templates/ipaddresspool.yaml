apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lan
  namespace: metallb-system
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  addresses:
    # .240 ist die AdGuard-VM, .245 der Node k3s-luna – beide nicht im Pool
    - 192.168.0.241-192.168.0.244
    - 192.168.0.246-192.168.0.250
    - fd00:2222::240-fd00:2222::250
  autoAssign: true
