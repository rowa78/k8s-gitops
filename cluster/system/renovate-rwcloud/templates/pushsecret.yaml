# Migration SealedSecret -> ExternalSecret: schreibt das Secret `renovate` in den
# 1Password-Eintrag `renovate-rwcloud#renovate` (Tresor k8s). Wird mit der Umstellung entfernt.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: renovate
  namespace: renovate-rwcloud
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword-push
  selector:
    secret:
      name: renovate
  data:
    - match:
        secretKey: RENOVATE_TOKEN
        remoteRef:
          remoteKey: renovate-rwcloud#renovate
          property: RENOVATE_TOKEN
    - match:
        secretKey: RENOVATE_GITHUB_COM_TOKEN
        remoteRef:
          remoteKey: renovate-rwcloud#renovate
          property: RENOVATE_GITHUB_COM_TOKEN
