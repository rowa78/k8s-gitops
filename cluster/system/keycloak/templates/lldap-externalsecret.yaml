# Secret aus dem 1Password-Tresor k8s (Eintrag keycloak#<secretName>), migriert von SealedSecret.
{{- if and .Values.lldap.enabled .Values.lldap.secrets.create }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.lldap.secrets.secretName }}
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: {{ .Values.lldap.secrets.secretName }}
  dataFrom:
    - extract:
        key: keycloak#{{ .Values.lldap.secrets.secretName }}
{{- end }}
