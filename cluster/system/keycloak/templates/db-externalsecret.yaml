# Secret aus dem 1Password-Tresor k8s (Eintrag keycloak#db-secret), migriert von SealedSecret.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-secret
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: db-secret
  dataFrom:
    - extract:
        key: keycloak#db-secret
