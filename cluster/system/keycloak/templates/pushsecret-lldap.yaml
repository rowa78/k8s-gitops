# Migration SealedSecret -> ExternalSecret (Schritt 1): schreibt die Secrets dieses Verzeichnisses je in den
# 1Password-Eintrag `<namespace>#<secret-name>` (Tresor k8s). Wird mit der Umstellung entfernt.
{{- if and .Values.lldap.enabled .Values.lldap.secrets.create .Values.lldap.secrets.sealedSecret.enabled .Values.lldap.secrets.sealedSecret.encryptedJwtSecret .Values.lldap.secrets.sealedSecret.encryptedLdapUserPass }}
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ .Values.lldap.secrets.secretName }}
  namespace: keycloak
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword-push
  selector:
    secret:
      name: {{ .Values.lldap.secrets.secretName }}
  data:
    - match:
        secretKey: JWT_SECRET
        remoteRef:
          remoteKey: keycloak#{{ .Values.lldap.secrets.secretName }}
          property: JWT_SECRET
    - match:
        secretKey: LDAP_USER_PASS
        remoteRef:
          remoteKey: keycloak#{{ .Values.lldap.secrets.secretName }}
          property: LDAP_USER_PASS
{{- end }}
