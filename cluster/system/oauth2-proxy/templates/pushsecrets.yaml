# Migration SealedSecret -> ExternalSecret (Schritt 1): schreibt die Secrets dieses Verzeichnisses je in den
# 1Password-Eintrag `<namespace>#<secret-name>` (Tresor k8s). Wird mit der Umstellung entfernt.
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: keycloak-oauth2-proxy
  namespace: oauth2-proxy
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword-push
  selector:
    secret:
      name: keycloak-oauth2-proxy
  data:
    - match:
        secretKey: client-id
        remoteRef:
          remoteKey: oauth2-proxy#keycloak-oauth2-proxy
          property: client-id
    - match:
        secretKey: client-secret
        remoteRef:
          remoteKey: oauth2-proxy#keycloak-oauth2-proxy
          property: client-secret
    - match:
        secretKey: cookie-secret
        remoteRef:
          remoteKey: oauth2-proxy#keycloak-oauth2-proxy
          property: cookie-secret
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: redis-password
  namespace: oauth2-proxy
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword-push
  selector:
    secret:
      name: redis-password
  data:
    - match:
        secretKey: redis-password
        remoteRef:
          remoteKey: oauth2-proxy#redis-password
          property: redis-password
