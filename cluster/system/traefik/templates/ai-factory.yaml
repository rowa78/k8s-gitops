###############################################################################
# Service
###############################################################################
apiVersion: v1
kind: Service
metadata:
  name: factory-service
  namespace: default
spec:
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
###############################################################################
# Endpoints (statt EndpointSlice!)
###############################################################################
apiVersion: v1
kind: Endpoints
metadata:
  name: factory-service
  namespace: default
subsets:
  - addresses:
      - ip: 192.168.0.155
    ports:
      - name: http
        port: 3000
---
###############################################################################
# Certificate
###############################################################################
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: factory-cert
  namespace: default
spec:
  secretName: factory-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - factory.rwcloud.org
---
###############################################################################
# IngressRoute
###############################################################################
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: factory
  namespace: default
  annotations:
    gethomepage.dev/href: "https://factory.rwcloud.org"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: terra
    gethomepage.dev/group: System
    gethomepage.dev/icon: factory.png
    gethomepage.dev/pod-selector: ""
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`factory.rwcloud.org`)
      services:
        - name: factory-service
          port: 3000
          scheme: http
          serversTransport: factory-transport
  tls:
    secretName: factory-tls
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: factory-transport
  namespace: default
spec:
  insecureSkipVerify: true