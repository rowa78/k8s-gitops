# Migration SealedSecret -> ExternalSecret (Schritt 1): schreibt die Secrets dieses Verzeichnisses je in den
# 1Password-Eintrag `<namespace>#<secret-name>` (Tresor k8s). Wird mit der Umstellung entfernt.
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: external-dns-secrets
  namespace: cloudflare
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword-push
  selector:
    secret:
      name: external-dns-secrets
  data:
    - match:
        secretKey: cloudflare_api_token
        remoteRef:
          remoteKey: cloudflare#external-dns-secrets
          property: cloudflare_api_token
    - match:
        secretKey: endpoint
        remoteRef:
          remoteKey: cloudflare#external-dns-secrets
          property: endpoint
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: tunnel-credentials
  namespace: cloudflare
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword-push
  selector:
    secret:
      name: tunnel-credentials
  data:
    - match:
        secretKey: cert.pem
        remoteRef:
          remoteKey: cloudflare#tunnel-credentials
          property: cert.pem
    - match:
        secretKey: credentials.json
        remoteRef:
          remoteKey: cloudflare#tunnel-credentials
          property: credentials.json
