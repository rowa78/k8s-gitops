# Migration SealedSecret -> ExternalSecret (Schritt 1): schreibt die Secrets dieses Verzeichnisses je in den
# 1Password-Eintrag `<namespace>#<secret-name>` (Tresor k8s). Wird mit der Umstellung entfernt.
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: alertmanager-discord-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword-push
  selector:
    secret:
      name: alertmanager-discord-secret
  data:
    - match:
        secretKey: DISCORD_WEBHOOK
        remoteRef:
          remoteKey: monitoring#alertmanager-discord-secret
          property: DISCORD_WEBHOOK
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: sealed-secrets-rwcloud
  namespace: monitoring
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword-push
  selector:
    secret:
      name: sealed-secrets-rwcloud
  data:
    - match:
        secretKey: BLOCKY_DB_PASSWORD
        remoteRef:
          remoteKey: monitoring#sealed-secrets-rwcloud
          property: BLOCKY_DB_PASSWORD
    - match:
        secretKey: BLOCKY_DB_USERNAME
        remoteRef:
          remoteKey: monitoring#sealed-secrets-rwcloud
          property: BLOCKY_DB_USERNAME
    - match:
        secretKey: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
        remoteRef:
          remoteKey: monitoring#sealed-secrets-rwcloud
          property: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
    - match:
        secretKey: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
        remoteRef:
          remoteKey: monitoring#sealed-secrets-rwcloud
          property: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
    - match:
        secretKey: GF_PANELS_DISABLE_SANITIZE_HTML
        remoteRef:
          remoteKey: monitoring#sealed-secrets-rwcloud
          property: GF_PANELS_DISABLE_SANITIZE_HTML
    - match:
        secretKey: GF_SMTP_ENABLED
        remoteRef:
          remoteKey: monitoring#sealed-secrets-rwcloud
          property: GF_SMTP_ENABLED
    - match:
        secretKey: GF_SMTP_FROM_ADDRESS
        remoteRef:
          remoteKey: monitoring#sealed-secrets-rwcloud
          property: GF_SMTP_FROM_ADDRESS
    - match:
        secretKey: GF_SMTP_FROM_NAME
        remoteRef:
          remoteKey: monitoring#sealed-secrets-rwcloud
          property: GF_SMTP_FROM_NAME
    - match:
        secretKey: GF_SMTP_HOST
        remoteRef:
          remoteKey: monitoring#sealed-secrets-rwcloud
          property: GF_SMTP_HOST
    - match:
        secretKey: GF_SMTP_PASSWORD
        remoteRef:
          remoteKey: monitoring#sealed-secrets-rwcloud
          property: GF_SMTP_PASSWORD
    - match:
        secretKey: GF_SMTP_USER
        remoteRef:
          remoteKey: monitoring#sealed-secrets-rwcloud
          property: GF_SMTP_USER
