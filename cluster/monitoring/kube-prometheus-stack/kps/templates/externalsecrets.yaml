# Secrets aus dem 1Password-Tresor k8s (Eintrag <namespace>#<secret-name>), migriert von SealedSecrets.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-discord-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: alertmanager-discord-secret
  dataFrom:
    - extract:
        key: monitoring#alertmanager-discord-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sealed-secrets-rwcloud
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: sealed-secrets-rwcloud
  dataFrom:
    - extract:
        key: monitoring#sealed-secrets-rwcloud
