# Factory-Konfiguration dieses Repos
pack: dev
# Zuständiger Worker aus config/workers.yml der Factory
worker: homelab-ct

# Workflows: Folge von Stationen und Toren (gate:<name>, siehe config/factory.yml → gates)
workflows:
  feature: [spec, gate:approved, build, review, gate:merge]
  bugfix:  [build, review, gate:merge]          # ohne Spec-Station
  design:  [spec, gate:merge]                   # nur Gesamt-Spec, Spec-PR wird gemergt
  setup:   [scaffold, review, gate:merge]       # neues Projekt: Gerüst, CI, CLAUDE.md
  import:  [onboard, review, gate:merge]        # bestehendes Projekt einrichten

# Welcher Workflow für ein Issue gilt: erstes passendes Label, sonst default_workflow
workflow_by_label:
  type:bug: bugfix
  type:design: design
  type:setup: setup
  type:import: import
default_workflow: feature

# Optionale Überschreibungen der globalen Standards
# stages:
#   build: { model: opus }
