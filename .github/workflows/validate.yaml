---
name: validate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  KUBECONFORM_VERSION: v0.6.7
  GITLEAKS_VERSION: 8.21.2

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          pip install --user yamllint
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" kubeconform
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fetch base branch
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: YAML syntax (yq)
        run: find cluster -name '*.y*ml' -not -path '*/templates/*' -exec yq e '.' {} + >/dev/null

      - name: yamllint (changed files)
        run: |
          git diff --name-only --diff-filter=d origin/main...HEAD -- '*.yaml' '*.yml' \
            | xargs -r -d '\n' yamllint

      - name: Render charts and validate (changed apps)
        run: |
          # nearest Chart.yaml above each changed file below cluster/
          charts=$(git diff --name-only --diff-filter=d origin/main...HEAD -- cluster \
            | while read -r f; do
                d=$(dirname "$f")
                while [ "$d" != "cluster" ] && [ "$d" != "." ] && [ ! -f "$d/Chart.yaml" ]; do
                  d=$(dirname "$d")
                done
                [ -f "$d/Chart.yaml" ] && echo "$d"
              done | sort -u)
          status=0
          for chart in $charts; do
            echo "::group::$chart"
            helm dependency build "$chart" \
              && helm template "$chart" | kubeconform -strict -ignore-missing-schemas -summary \
              || { echo "::error::$chart fehlgeschlagen"; status=1; }
            echo "::endgroup::"
          done
          exit $status

      - name: Secret scan (PR commits)
        run: gitleaks detect --no-banner --redact --log-opts="origin/main..HEAD"
